name: UX 2.2 Review IPA

on:
  push:
    branches:
      - codex/tempo-v2.2.0-ux-foundation-review
  workflow_dispatch:

concurrency:
  group: review-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-review-ipa:
    runs-on: macos-15
    permissions:
      contents: read
    timeout-minutes: 35

    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run deterministic domain tests
        run: swift test

      - name: Enforce local-only networking policy
        run: |
          ! rg --glob '*.swift' \
            'URLSession|NWConnection|Alamofire|Firebase|Analytics|CloudKit|OpenAI|Anthropic' \
            App Sources

      - name: Compile review app
        run: |
          set -o pipefail
          xcodebuild build \
            -project Tempo.xcodeproj \
            -scheme Tempo \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$PWD/build/ReviewDerivedData" \
            CODE_SIGNING_ALLOWED=NO

      - name: Build ARM64 device archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Tempo.xcodeproj \
            -scheme Tempo \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -sdk iphoneos \
            -archivePath "$PWD/build/Tempo-UX22-Review.xcarchive" \
            -derivedDataPath "$PWD/build/ReviewDerivedData" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package re-sign-ready IPA
        run: |
          set -euo pipefail
          archive="$PWD/build/Tempo-UX22-Review.xcarchive"
          app_path="$archive/Products/Applications/Tempo.app"
          output="$PWD/build/review-output"

          test -d "$app_path"
          test -f "$app_path/Info.plist"
          test -f "$app_path/Tempo"

          /usr/bin/codesign --force --deep --sign - --timestamp=none "$app_path"
          /usr/bin/codesign --verify --deep --strict --verbose=2 "$app_path"
          /usr/bin/file "$app_path/Tempo" | /usr/bin/grep -q arm64

          mkdir -p "$output/Payload"
          cp -R "$app_path" "$output/Payload/"
          (cd "$output" && /usr/bin/zip -qry Tempo-UX22-review-resign-ready.ipa Payload)
          /usr/bin/unzip -t "$output/Tempo-UX22-review-resign-ready.ipa"

          bundle_id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app_path/Info.plist")
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app_path/Info.plist")
          build=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app_path/Info.plist")
          minimum_ios=$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$app_path/Info.plist")

          (cd "$output" && shasum -a 256 Tempo-UX22-review-resign-ready.ipa > Tempo-UX22-review-resign-ready.ipa.sha256)

          cat > "$output/BUILD_INFO.txt" <<EOF
          TEMPO UX 2.2 review build
          Branch: $GITHUB_REF_NAME
          Commit: $GITHUB_SHA
          Workflow run: $GITHUB_RUN_NUMBER
          Bundle ID: $bundle_id
          Version: $version
          Build: $build
          Minimum iOS: $minimum_ios

          This IPA is re-sign-ready and is not signed for a specific Apple ID or device.
          Re-sign it with Sideloadly, AltStore, SideStore, or your own Apple certificate before installing.
          EOF

      - name: Upload review IPA
        uses: actions/upload-artifact@v4
        with:
          name: Tempo-UX22-review-IPA-${{ github.run_number }}
          path: |
            build/review-output/Tempo-UX22-review-resign-ready.ipa
            build/review-output/Tempo-UX22-review-resign-ready.ipa.sha256
            build/review-output/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 14
